name: task
description: >-
  One tracker task from taking it to a merged pull request: the analyst takes the task and
  designs the change with the human as an openspec change, the human approves the design,
  the developer builds it and opens the pull request, the reviewer runs local and external
  review rounds until they converge, the human approves the merge, the integrator archives
  the change inside the pull request, merges it and updates the tracker. The run's task is
  the tracker task's key, with anything the human said about it.
start: design
states:
  design:
    agent: analyst
    reads: [build-report]
    produces: [design]
    do: |
      Take the tracker task the run's task names and design its change with the human, as your
      role describes: take the task, check it is still wanted, propose the scale, then the
      dialogue and the documents of that scale.
      On a later visit the previous step's note says why you are back: the human's reason
      for rejecting the design at `design_ok`, or the developer's reason for `redesign`
      (its `build-report` says what cannot be built as approved); quote either reason at
      the top of `design`. Revise the committed change, not a version from memory, and write
      `design` whole again.
      Done when the human has answered every question you asked, the change's files are
      committed on the run's branch, `openspec validate <change> --strict` passes and
      `design` holds them. Report `ready`: note_summary is the key, the scale and the
      change's one-line summary; note_body what changed since the last visit and the
      engineering decisions you took for the record. Report `dropped` only when the human
      agreed the task is no longer wanted; `design` then says why, and nothing new is
      committed. When the task is already in the "in progress" or "review"
      status, ask, in the message where you propose dropping it, whether to move it back
      and to which status, and move it only on their yes (`sdlc-settings`, "Writing to
      the tracker").
    outcomes: {ready: design_ok, dropped: dropped}
  design_ok:
    gate: approval
    reads: [design]
    ask: >-
      Approve the design: scope, scale, target branch and the openspec change? The
      developer starts the code from it.
    outcomes: {approved: build, rejected: design}
  build:
    agent: developer
    reads: [design, ledger]
    produces: [build-report]
    do: |
      Build the approved change (your `design` input) in the run's worktree, as your role
      describes, and bring its pull request up to date.
      On a visit after `design_ok` (the first, or after `redesign`) the note is the
      human's answer there: a comment binds like the design; build the approved change
      (after `redesign`, the revised one). On a visit after another step the note says
      what to fix: the reviewer's `ledger` (fix every finding whose fate is "fix"), the
      human's reason for rejecting the merge at `merge_ok` (quote it at the top of
      `build-report` and fix it like a finding; when it is only that the review did not
      converge, with nothing in the code to fix, quote it and report `ready`), or a
      refused archive, a conflict or a red check from `merge`, as your role describes
      ("Fixing").
      Done when every task of the change's `tasks.md` is checked or says why not, the
      project's checks pass with their numbers in `build-report`, the work is committed
      and pushed and the pull request's description matches the diff. Report `ready`:
      note_summary is your status and a one-line result; note_body what changed since
      the last visit.
      Report `redesign` instead when the work needs a change of scope or a decision the
      design does not hold: `build-report` says what and why, and nothing half done is
      left uncommitted.
    outcomes: {ready: review, redesign: design}
  review:
    agent: reviewer
    max_visits: 6
    reads: [design, build-report]
    produces: [ledger]
    do: |
      Run one round of `review-loop` on the pull request, read-only, as your role
      describes: a local review pass, a check against the change's spec, and, once the
      local pass leaves nothing to fix, an external round with its delta comment.
      On a later visit your previous ledger is your `ledger` artifact: mark each of its
      findings RESOLVED or STILL OPEN first.
      The visits hold the first local round, a local round after its fixes, the external
      rounds up to the round cap, and a return after `merge_ok` or `conflicts`; reaching
      the limit is rare.
      Done when every finding of this round has a verdict, a tier and a fate with its
      evidence, and `ledger` is written whole. Report `converged` when the stop criterion
      of `review-loop` holds, or the human accepted the open findings, recorded in
      `ledger` with the closing report; otherwise `changes`: note_summary is the round,
      the verdict and the counts by tier; note_body the findings the developer must fix,
      by ID.
    outcomes: {changes: build, converged: merge_ok}
  merge_ok:
    gate: approval
    reads: [ledger]
    ask: >-
      Archive the change and merge the pull request into its target branch, with the
      findings the ledger leaves open? The integrator archives inside the pull request,
      brings the target in, merges with a merge commit and updates the tracker.
    outcomes: {approved: merge, rejected: build}
  merge:
    agent: integrator
    reads: [design, ledger]
    do: |
      Archive the change and merge the pull request as your role describes ("Merge"); a
      comment of the human at `merge_ok` binds.
      Report `merged` once the pull request's state is merged and the tracker routine is
      done: note_summary is the pull request and the merge commit; note_body what was
      done in git and in the tracker and what is left for the human. Report `conflicts`
      when the change cannot be archived, bringing the target in conflicts in a file
      other than the changelog, or a local
      check or CI is red for a cause in the work: what to undo and what to leave is your
      role's ("Merge"); name the reason, the files or the failing check in note_body. A
      cause outside the work, a CI past its time ceiling or a host that refuses the merge
      is no outcome: send it to the supervisor and stay in `merge` (your role, "Merge").
    outcomes: {merged: done, conflicts: build}
  done:
    end: true
  dropped:
    end: true
