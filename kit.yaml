name: sdlc
version: 0.3.0
description: >-
  Day-to-day development of a project whose tasks live in a task tracker, one task per
  run: an analyst takes the task and designs the change with you as an openspec change, a
  developer builds it test-first and opens the pull request, a reviewer drives it through
  local and external review rounds, an integrator archives the change inside the pull
  request and merges it with the tracker routine. You approve the design and the merge.
  Start it with a tracker kit that gives the roles the skill tracker.
supervisor: supervisor
expects:
  skills: [tracker]
  commands: [git, openspec]
dependencies:
  lado: ">=0.30"
  skills:
    superpowers:
      from: https://github.com/obra/superpowers@v6.4.1
      folders:
        - skills/brainstorming
        - skills/writing-plans
        - skills/test-driven-development
        - skills/systematic-debugging
        - skills/verification-before-completion
    mattpocock-skills:
      from: https://github.com/mattpocock/skills@v1.2.3
      folders:
        - skills/productivity/grilling
